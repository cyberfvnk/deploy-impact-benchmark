# Configuração do ElasticMQ (formato HOCON).
include classpath("application.conf")

# Endereço que aparece nas URLs das filas devolvidas por GetQueueUrl.
# Precisa ser o nome do serviço no compose para os containers acessarem.
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # "strict" aplica os limites reais do SQS (ex.: máx. 10 msgs por receive).
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  # Fila de ENTRADA (equivale à fila consumida pela app em produção).
  bench-input {
    defaultVisibilityTimeout = 30 seconds
    # Sobrescrito pela variável de ambiente, se existir.
    defaultVisibilityTimeout = ${?INPUT_VISIBILITY_TIMEOUT}
    receiveMessageWait = 0 seconds
  }

  # Fila FINAL (onde a app publica o resultado). O coletor de métricas lê daqui.
  bench-final {
    defaultVisibilityTimeout = 30 seconds
  }
}
